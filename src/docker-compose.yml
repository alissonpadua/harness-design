# Agent-first boilerplate stack — NOTHING runs on host (ADR-0008)
name: bp
services:
  app:
    image: bp-app
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
      - appvendor:/var/www/html/vendor
    depends_on:
      pgsql: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: 5432
      DB_DATABASE: boilerplate
      DB_USERNAME: boilerplate
      DB_PASSWORD: secret
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: database
      REDIS_HOST: redis
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      AWS_ACCESS_KEY_ID: boilerplate
      AWS_SECRET_ACCESS_KEY: boilerplate-dev
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT: http://rustfs:9000
      AWS_BUCKET: private-assets
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_APP_ID: boilerplate
      REVERB_APP_KEY: bo-key
      REVERB_APP_SECRET: bo-secret
    healthcheck:
      test: ["CMD-SHELL", "php -r 'echo 1;' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      app: { condition: service_started }

  pgsql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: boilerplate
      POSTGRES_USER: boilerplate
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boilerplate"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:8025:8025"]

  rustfs:
    image: rustfs/rustfs:latest
    command: /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: boilerplate
      MINIO_ROOT_PASSWORD: boilerplate-dev
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes:
      - miniodata:/data

  bucket-init:
    image: amazon/aws-cli:latest
    depends_on:
      rustfs: { condition: service_started }
    environment:
      AWS_ACCESS_KEY_ID: boilerplate
      AWS_SECRET_ACCESS_KEY: boilerplate-dev
    entrypoint: >
      /bin/sh -c "
      for i in $(seq 1 30); do
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket private-assets 2>/dev/null && exit 0;
        aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket private-assets 2>/dev/null && exit 0;
        sleep 2;
      done; echo 'bucket-init: rustfs not reachable' >&2; exit 1"

  reverb:
    image: bp-app
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports: ["127.0.0.1:8081:8080"]
    depends_on:
      app: { condition: service_started }
      redis: { condition: service_healthy }
    volumes:
      - .:/var/www/html
      - appvendor:/var/www/html/vendor

  horizon:
    image: bp-app
    profiles: ["worker"]
    command: php artisan horizon
    depends_on:
      app: { condition: service_started }
      redis: { condition: service_healthy }
    volumes:
      - .:/var/www/html
      - appvendor:/var/www/html/vendor

  scheduler:
    image: bp-app
    profiles: ["scheduler"]
    command: >
      /bin/sh -c "while true; do php artisan schedule:run --no-interaction --force; sleep 60; done"
    depends_on:
      app: { condition: service_started }
    volumes:
      - .:/var/www/html
      - appvendor:/var/www/html/vendor

volumes:
  pgdata:
  miniodata:
  appvendor:
