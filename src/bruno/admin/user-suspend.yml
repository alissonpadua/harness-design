info:
  name: Users: suspend (evicts sessions)
  type: http
  seq: 4

http:
  method: post
  url: "{{baseUrl}}/admin/v1/users/1/suspend"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "reason": "Fraud investigation #421"
      }
  auth:
    type: bearer
    token: "{{token}}"

docs: |-
  Spec 005 AC-005.3 — sets suspended_at, revokes every active token EXCEPT the
    acting admin's (sole-owner orgs protected: 422), audits user.suspend.
    Suspended users get 403 'Account suspended.' at login lanes and all API calls.
