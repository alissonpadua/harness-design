info: { name: Show organization, type: http, seq: 3 }
http:
  method: GET
  url: "{{baseUrl}}/api/v1/orgs/:organization"
  params:
    - { name: organization, value: "1", type: path, description: "org id OR slug" }
  auth: { type: bearer, token: "{{token}}" }
runtime:
  assertions:
    - { expression: res.status, operator: eq, value: "200" }
