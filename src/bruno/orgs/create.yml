info:
  name: Create organization
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/orgs"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Acme Rockets"
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
