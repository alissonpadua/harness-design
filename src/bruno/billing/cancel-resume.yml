info:
  name: Cancel at period end / resume
  type: http
  seq: 11

http:
  method: POST
  url: "{baseUrl}/api/v1/orgs/:organization/billing/subscription/cancel"
  params:
    - name: organization
      value: "2"
      type: path
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "cancel": true
      }
  auth:
    type: bearer
    token: "{token}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

docs: cancel=false resumes.
