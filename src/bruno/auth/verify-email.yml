info:
  name: Verify email (link)
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/auth/verify-email/:userId/:token"
  params:
    - name: userId
      value: "1"
      type: path
    - name: token
      value: "paste-token-from-mailpit"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("200 verified or 403 generic invalid-link", function () {
          expect([200, 403]).to.include(res.status);
        });

docs: |-
  AC-001.2. Copy the token from the verification email (Mailpit UI at
  http://localhost:8025). Single-use; expired/consumed/tampered all return the
  same 403 {"message":"This verification link is no longer valid."}.

settings:
  encodeUrl: true
