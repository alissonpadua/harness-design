info:
  name: OAuth — exchange code
  type: http
  seq: 21

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/oauth/:provider/exchange"
  params:
    - name: provider
      value: google
      type: path
  body:
    type: json
    data: |-
      {
        "code": "paste-code-from-callback",
        "device_type": "web"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setEnvVar('token', res.body.data.token);
        }
    - type: tests
      code: |-
        test("200 token | 401 generic | 403 verify/mandatory", function () {
          expect([200, 401, 403]).to.include(res.status);
        });

docs: |-
  AC-001.13/.14. Provider identity → login; verified-google email auto-links;
  facebook identities create unverified accounts (403 verify gate + mail);
  soft-deleted owners → identical generic 401.
