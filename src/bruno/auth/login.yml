info:
  name: Login
  type: http
  seq: 4
  tags:
    - auth

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "ada@example.com",
        "password": "N3w!SecretPass",
        "device_type": "web"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setEnvVar('token', res.body.data.token);
        }
    - type: tests
      code: |-
        test("200 + token, stored into {{token}} for chained requests", function () {
          expect(res.status).to.be.oneOf([200, 401, 403]);
          if (res.status === 200) {
            expect(res.body.data.token).to.be.a('string');
            expect(res.body.data.device_type).to.equal('web');
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  AC-001.5. device_type ∈ web|mobile|desktop|cli. Re-login on the same type
  revokes the previous token of that type only. Unverified → 403 verify
  message; wrong credentials / soft-deleted / unknown → identical 401.
