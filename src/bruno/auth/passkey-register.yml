info:
  name: Passkey — register options + submit
  type: http
  seq: 17
  docs: |
    Requires auth ({{token}} from Login). Sequence:
    1. POST /api/v1/auth/passkeys/register/options → data.publicKey
    2. navigator.credentials.create(publicKey) → send {name, credential} to
       POST /api/v1/auth/passkeys/register (201; max 5 keys, 422 beyond).
    GET/DELETE /api/v1/auth/passkeys manage the list.
