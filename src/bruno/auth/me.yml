info:
  name: Current user (me)
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/v1/auth/me"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  variables:
    - name: token
      value: 1|IVI84Z349oksJhrKSDOTEZcGFftd2aCPAeoDVQb79ab6be68
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Run Login first to populate {{token}}.
