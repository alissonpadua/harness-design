info:
  name: Forgot password
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/forgot-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "ada@example.com"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "202"

docs: |-
  AC-001.10. Always 202. Copy the reset token from the mail in Mailpit
  (http://localhost:8025) into the Reset password request.
