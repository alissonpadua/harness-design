info:
  name: Inbox
  type: http
  seq: 1

http:
  method: GET
  url: "{baseUrl}/api/v1/notifications"
  auth:
    type: bearer
    token: "{token}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

docs: Offline fetch of persisted in-app notifications (newest-first, cursor-paginated).
